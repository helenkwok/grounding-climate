name: Earth observation data smoke

on:
  pull_request:
    paths:
      - "scripts/fetch-hls-burn-scar-sample.py"
      - "scripts/smoke-hls-burn-scars.py"
      - ".github/workflows/earth-observation-data-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hls-burn-scar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pinned upstream archive
        uses: actions/cache@v4
        with:
          path: /tmp/grounding-hls-cache
          key: hls-burn-scars-1864285e25010d346a842e4f068b1a1d4248ed6d

      - name: Fetch and verify one pinned test pair
        run: |
          python scripts/fetch-hls-burn-scar-sample.py /tmp/hls-scene

      - name: Install smoke dependencies
        run: python -m pip install --disable-pip-version-check rasterio numpy pillow

      - name: Run NBR baseline and visual comparison
        run: |
          mkdir -p /tmp/hls-output
          python scripts/smoke-hls-burn-scars.py \
            /tmp/hls-scene/subsetted_512x512_HLS.S30.T10SEH.2018190.v1.4_merged.tif \
            /tmp/hls-scene/subsetted_512x512_HLS.S30.T10SEH.2018190.v1.4.mask.tif \
            --threshold 0 \
            --scene-id T10SEH.2018190.v1 \
            --output-json /tmp/hls-output/report.json \
            --output-png /tmp/hls-output/comparison.png

      - name: Print measured report
        run: cat /tmp/hls-output/report.json

      - name: Upload measured JSON and visual comparison
        uses: actions/upload-artifact@v4
        with:
          name: hls-burn-scar-t10seh-2018190
          path: /tmp/hls-output/
          if-no-files-found: error
