name: BatteryLife CALB data smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/battery-dpp/**"
      - "scripts/prepare-batterylife-calb.py"
      - "scripts/smoke-batterylife-calb.mjs"
      - ".github/workflows/batterylife-calb-smoke.yml"

permissions:
  contents: read

jobs:
  calb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install processed-data decoder dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Prepare paper-era BatteryLife v4 CALB subset
        run: python scripts/prepare-batterylife-calb.py /tmp/batterylife-v4 v4
      - name: Prepare corrected BatteryLife v11 CALB subset
        run: python scripts/prepare-batterylife-calb.py /tmp/batterylife-v11 v11
      - name: Build ClimateChain workspaces
        run: |
          npm install
          npm run build
      - name: Reproduce paper CALB baseline and build current passport
        run: node scripts/smoke-batterylife-calb.mjs /tmp/batterylife-v4 /tmp/batterylife-v11
