name: Energy-EVA data smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/energy-forecast/**"
      - "scripts/prepare-energy-eva-active-power.mjs"
      - "scripts/inspect-energy-eva-parquet.py"
      - ".github/workflows/energy-eva-data-smoke.yml"

permissions:
  contents: read

jobs:
  active-power:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stream standardized active-power parquet
        run: node scripts/prepare-energy-eva-active-power.mjs /tmp/energy-eva
      - name: Install Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow
      - name: Inspect standardized schema
        run: python scripts/inspect-energy-eva-parquet.py /tmp/energy-eva/active_power_load.parquet
