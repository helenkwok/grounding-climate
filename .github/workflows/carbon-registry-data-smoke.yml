name: Carbon registry data smoke

on:
  push:
    paths:
      - "packages/carbon-registry/**"
      - "scripts/prepare-carbonplan-registry-fixtures.mjs"
      - "scripts/smoke-carbon-registry.mjs"
      - ".github/workflows/carbon-registry-data-smoke.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "packages/carbon-registry/**"
      - "scripts/prepare-carbonplan-registry-fixtures.mjs"
      - "scripts/smoke-carbon-registry.mjs"
      - ".github/workflows/carbon-registry-data-smoke.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  carbonplan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare pinned CarbonPlan registry fixtures
        run: node scripts/prepare-carbonplan-registry-fixtures.mjs /tmp/carbonplan-registry
      - name: Build ClimateChain workspaces
        run: |
          npm ci
          npm run build
      - name: Reconcile registry records and run duplicate/tamper demos
        run: node scripts/smoke-carbon-registry.mjs /tmp/carbonplan-registry
